<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TODO App</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container">
    <h1>My TODO</h1>
    <form id="todo-form">
      <input id="todo-input" type="text" placeholder="Add new task..." autocomplete="off" required />
      <button type="submit">Add</button>
    </form>
    <ul id="todo-list"></ul>
    <p id="empty-msg" class="empty">No tasks yet.</p>
  </main>
  <script src="app.js"></script>
</body>
</html>
